<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТІЛАШАР | Логопед кабинеті</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="cabinet-page">
<header class="main-header">
    <div class="logo" onclick="window.location.href='index.html'">
        ТІЛАШАР
    </div>
    <div class="header-title">ЛОГОПЕД КАБИНЕТІ</div>
    <button class="cabinet-button"
        onclick="window.location.href='index.html'">
        ← БАСТЫ БЕТ
    </button>
</header>
<main class="cabinet-container">
    <section class="welcome-box">
        <h1>🩺 ЛОГОПЕД КАБИНЕТІ</h1>
        <p>Пациент туралы мәліметтерді енгізіп, диагностика нәтижелерін бақылаңыз.</p>
    </section>
    <!-- ПАЦИЕНТТІ ТІРКЕУ -->
    <section class="patient-form">
        <h2>👤 ПАЦИЕНТТІ ТІРКЕУ</h2>
        <form id="patientForm">
            <label for="fullName">Аты-жөні:</label>
            <input type="text" id="fullName"
                placeholder="Пациенттің аты-жөнін енгізіңіз" required>
            <label for="birthDate">Туған күні:</label>
            <input type="date" id="birthDate" required>
            <label for="age">Жасы:</label>
            <input type="number" id="age"
                placeholder="Жасы" min="1" max="120" required>
            <label for="diagnosis">Диагнозы:</label>
            <input type="text" id="diagnosis"
                placeholder="Диагнозды енгізіңіз">
            <label for="testDate">Тексеру күні:</label>
            <input type="date" id="testDate" required>
            <button type="submit" class="enter-button">
                💾 МӘЛІМЕТТЕРДІ САҚТАУ
            </button>
        </form>
        <div id="patientMessage"></div>
    </section>
    <!-- ПАЦИЕНТ БӨЛІМДЕРІ -->
    <section class="patient-sections">
        <h2>📋 ПАЦИЕНТТІҢ ЖҰМЫС КАРТАСЫ</h2>
        <div class="world-grid">
            <button class="world-card"
                onclick="showPatientSection('speechCard')">
                <span>📄</span>
                <h3>СӨЙЛЕУ КАРТАСЫ</h3>
                <p>Пациенттің жеке сөйлеу картасы</p>
            </button>
            <button class="world-card"
                onclick="showPatientSection('diagnostics')">
                <span>🔎</span>
                <h3>ДИАГНОСТИКА</h3>
                <p>Сөйлеу дағдыларын тексеру тапсырмалары</p>
            </button>
            <button class="world-card"
                onclick="showPatientSection('initialResult')">
                <span>📊</span>
                <h3>БАСТАПҚЫ НӘТИЖЕ</h3>
                <p>Алғашқы тексеру көрсеткіштері</p>
            </button>
            <button class="world-card"
                onclick="showPatientSection('dynamics')">
                <span>📈</span>
                <h3>ДИНАМИКА</h3>
                <p>Бастапқы және қайталама нәтижелерді салыстыру</p>
            </button>
        </div>
    </section>
    <!-- ТАҢДАЛҒАН БӨЛІМ -->
    <section id="patientContent" class="game-section"
        style="display:none;">
    </section>
</main>
<script src="cabinet.js"></script>
<script src="speech-card.js"></script>
<script src="dynamics.js"></script>
</body>
</html>
