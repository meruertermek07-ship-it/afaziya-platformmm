<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>АФАЗИЯ | ТІЛАШАР</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 1. БАСТЫ БЕТ -->
<section id="home" class="home-panel">
<div class="home-content">
    <div class="home-logo">✦ ТІЛАШАР ✦</div>
    <h1>АФАЗИЯ</h1>
    <p>Сөйлеуді қалпына келтіру бағдарламасы</p>
    <button type="button" class="start-button" onclick="enterProgram()">
        КІРУ →
    </button>
</div>
</section>
<!-- 2. БАҒДАРЛАМА -->
<section id="program" style="display:none;">
<!-- ЖОҒАРҒЫ БӨЛІК -->
<header class="main-header">
    <div class="brand">✦ ТІЛАШАР</div>
    <h1>АФАЗИЯ</h1>
    <button class="cabinet-button" onclick="openLogopedCabinet()">
        🩺 ЛОГОПЕД КАБИНЕТІ
    </button>
</header>
<!-- БӨЛІМДЕР -->
<main class="program-container">
    <div class="program-heading">
        <h2>СӨЙЛЕУ ӘЛЕМІНЕ ҚОШ КЕЛДІҢІЗ!</h2>
        <p>Өзіңізге қажетті бөлімді таңдаңыз</p>
    </div>
    <div class="world-grid">
        <button class="world-card" onclick="openSection('breathing', this)">
            <span>🌬️</span>
            <h3>ТЫНЫС АЛУ</h3>
            <p>Тыныс алу жаттығулары</p>
            <b>КІРУ →</b>
        </button>
        <button class="world-card" onclick="openSection('articulation', this)">
            <span>👄</span>
            <h3>АРТИКУЛЯЦИЯ</h3>
            <p>Артикуляциялық жаттығулар</p>
            <b>КІРУ →</b>
        </button>
        <button class="world-card" onclick="openSection('vocabulary', this)">
            <span>📚</span>
            <h3>СӨЗДІК ҚОР</h3>
            <p>Сөздік қорды дамыту</p>
            <b>КІРУ →</b>
        </button>
        <button class="world-card" onclick="openSection('understanding', this)">
            <span>🧠</span>
            <h3>СӨЙЛЕУДІ ТҮСІНУ</h3>
            <p>Сөзді тыңдау және түсіну</p>
            <b>КІРУ →</b>
        </button>
        <button class="world-card" onclick="openSection('speech', this)">
            <span>💬</span>
            <h3>СӨЙЛЕУДІ ҚАЛЫПТАСТЫРУ</h3>
            <p>Сөйлеу дағдыларын дамыту</p>
            <b>КІРУ →</b>
        </button>
        <button class="world-card" onclick="openSection('reading', this)">
            <span>📖</span>
            <h3>ОҚУ ЖӘНЕ ЖАЗУ</h3>
            <p>Оқу және жазу тапсырмалары</p>
            <b>КІРУ →</b>
        </button>
        <button class="world-card" onclick="openSection('logorhythmics', this)">
            <span>🎵</span>
            <h3>ЛОГОРИТМИКА</h3>
            <p>Қимыл мен ырғақ жаттығулары</p>
            <b>КІРУ →</b>
        </button>
        <button class="world-card" onclick="openSection('results', this)">
            <span>🏆</span>
            <h3>НӘТИЖЕЛЕР</h3>
            <p>Жетістіктер мен көрсеткіштер</p>
            <b>КІРУ →</b>
        </button>
    </div>
    <div id="section-content" style="display:none;"></div>
    <button type="button" class="back-button" onclick="showProgramMenu()">
        ← БӨЛІМДЕРГЕ ҚАЙТУ
    </button>
</main>
</section>
<script src="script.js"></script>
<script>
function enterProgram() {
    document.getElementById('home').style.display = 'none';
    document.getElementById('program').style.display = 'block';
}
function openLogopedCabinet() {
    window.location.href = 'cabinet.html';
}
function showProgramMenu() {
    document.getElementById('section-content').style.display = 'none';
    document.querySelector('.world-grid').style.display = 'grid';
    document.querySelector('.program-heading').style.display = 'block';
    document.querySelector('.back-button').style.display = 'none';
}
</script>
</body>
</html>
