<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТІЛАШАР — Афазия</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- БАСТЫ БЕТ -->
<section id="home">
    <h1>АФАЗИЯ</h1>
    <p>Сөйлеуді қалпына келтіру бағдарламасы</p>
    <button onclick="enterProgram()">КІРУ</button>
</section>
<!-- БАҒДАРЛАМА МӘЗІРІ -->
<section id="program" style="display:none;">
<header class="program-header">
    <div class="logo">ТІЛАШАР</div>
    <button class="cabinet-button" onclick="openLogopedCabinet()">
        ЛОГОПЕД КАБИНЕТІ
    </button>
</header>
<h1 class="program-title">АФАЗИЯ</h1>
<p class="program-description">
    Сөйлеу дағдыларын қалпына келтіруге арналған
    логопедиялық түзету бағдарламасы
</p>
<div id="world-grid">
    <button class="world-card" onclick="openSection('breathing')">
        <span class="world-icon">🌬️</span>
        ТЫНЫС АЛУ
    </button>
    <button class="world-card" onclick="openSection('articulation')">
        <span class="world-icon">👄</span>
        АРТИКУЛЯЦИЯ
    </button>
    <button class="world-card" onclick="openSection('vocabulary')">
        <span class="world-icon">📚</span>
        СӨЗДІК ҚОР
    </button>
    <button class="world-card" onclick="openSection('understanding')">
        <span class="world-icon">👂</span>
        СӨЙЛЕУДІ ТҮСІНУ
    </button>
    <button class="world-card" onclick="openSection('speech')">
        <span class="world-icon">🗣️</span>
        СӨЙЛЕУДІ ҚАЛЫПТАСТЫРУ
    </button>
    <button class="world-card" onclick="openSection('reading')">
        <span class="world-icon">📖</span>
        ОҚУ ЖӘНЕ ЖАЗУ
    </button>
    <button class="world-card" onclick="openSection('logorhythmics')">
        <span class="world-icon">🎵</span>
        ЛОГОРИТМИКА
    </button>
    <button class="world-card" onclick="openSection('results')">
        <span class="world-icon">📊</span>
        НӘТИЖЕЛЕР
    </button>
</div>
<div id="section-content" style="display:none;"></div>
</section>
<!-- ЛОГОПЕД КАБИНЕТІНЕ ӨТУ -->
<section id="logopedLogin" style="display:none;">
<div class="login-box">
    <div class="logo">ТІЛАШАР</div>
    <h2>ЛОГОПЕД КАБИНЕТІ</h2>
    <p>
        Сөйлеу картасы, диагностика және
        даму динамикасын бақылау жүйесі
    </p>
    <button onclick="enterLogopedCabinet()">
        КАБИНЕТКЕ КІРУ
    </button>
    <button onclick="backToProgram()"
        style="background:#f8f0df;color:#574735;">
        ← БАС МӘЗІРГЕ ҚАЙТУ
    </button>
</div>
</section>
<script src="script.js"></script>
</body>
</html>
